spring:
  application:
    name: sai-demo
  datasource:
    url: jdbc:postgresql://localhost:5432/sai
    username: postgres
    password: root
  ai:
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024
        max-document-batch-size: 10000
    ollama:
      init:
        pull-model-strategy: never
        timeout: 5m
        max-retries: 0
      base-url: http://localhost:11434
      chat:
        model: llama3.2
      embedding:
        model: mxbai-embed-large

